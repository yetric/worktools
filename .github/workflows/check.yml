name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install Zsh for completion integration tests
        run: sudo apt-get update -qq && sudo apt-get install --yes zsh
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o build/worktools ./cmd/worktools
      - run: bash -n install.sh
      - run: zsh -n completions/_worktools
